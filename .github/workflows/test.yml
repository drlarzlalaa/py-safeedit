name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run tests
        run: python -m unittest discover -s tests -v
      - name: run the example
        run: |
          mkdir demo && printf '<a class="b" href="x">x</a>\n' > demo/a.html
          python -m safeedit edit demo --glob '*.html' --find '(<a class="b")' --replace '\1 aria-label="B"' --prove-additive ' aria-label="B"' --skip-recent 0
          python -m safeedit edit demo --glob '*.html' --find '(<a class="b")' --replace '\1 aria-label="B"' --prove-additive ' aria-label="B"' --skip-recent 0 --apply bk.tar.gz
          grep -q aria-label demo/a.html
          python -m safeedit restore bk.tar.gz --root demo
          ! grep -q aria-label demo/a.html
